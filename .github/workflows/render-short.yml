name: Generate YouTube Short via Comment

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  build-video:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/create-short'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Audio & TTS Tools (FFmpeg & Edge-TTS)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install edge-tts --break-system-packages

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Voiceover, Audio Assets & Remotion Code via Gemini
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-short.js

      - name: Commit & Push Generated Remotion Code to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/Composition.tsx src/meta.json
          git diff --staged --quiet || git commit -m "chore: save Gemini-generated Composition.tsx [skip ci]"
          git push

      - name: Render Remotion Video
        run: npx remotion render src/index.ts MyShort out/short.mp4 --codec=h264

      - name: Upload Video & Generated Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-youtube-short
          path: |
            out/short.mp4
            src/Composition.tsx

      - name: Comment Preview Link on Success
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            const run_id = context.runId;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            
            const artifactUrl = `https://github.com/${repoOwner}/${repoName}/actions/runs/${run_id}`;
            const codeUrl = `https://github.com/${repoOwner}/${repoName}/blob/main/src/Composition.tsx`;

            await github.rest.issues.createComment({
              owner: repoOwner,
              repo: repoName,
              issue_number: issue_number,
              body: `🚀 **Your AI YouTube Short (with Voiceover, Custom SVG Graphics & Animations) is ready!**\n\n- [📦 Download Video Preview Artifact](${artifactUrl})\n- [💻 View Generated Remotion Code (\`src/Composition.tsx\`)](${codeUrl})`
            });

      - name: Comment Error Notice on Failure
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            const run_id = context.runId;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            
            const logsUrl = `https://github.com/${repoOwner}/${repoName}/actions/runs/${run_id}`;

            await github.rest.issues.createComment({
              owner: repoOwner,
              repo: repoName,
              issue_number: issue_number,
              body: `❌ **Oops! Something went wrong while generating your YouTube Short.**\n\nPlease check the [Workflow Error Logs](${logsUrl}) for the full traceback.`
            });
